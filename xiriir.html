  <main class="wrap">
    <h1>Nala soo xiriir</h1>
    <p>Qor magacaaga iyo fariintaada. Tani waa bogga xiriirka, fariintuna halkan ayay kaa hadhaysaa.</p>
    <form id="note">
      <input name="magac" placeholder="Magacaaga" required>
      <textarea name="fariin" rows="4" placeholder="Fariintaada" required></textarea>
      <button class="btn" type="submit">Dir</button>
    </form>
    <p id="done" hidden>Waa la helay. Mahadsanid.</p>
  </main>
  <footer>Magaalooyinka Soomaaliya</footer>
  <script>
    document.getElementById("note").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("done").hidden = false;
      event.target.reset();
    });
  </script>
</body>
